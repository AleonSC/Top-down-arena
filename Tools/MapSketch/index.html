<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Map Sketch">
<link rel="manifest" href="manifest.webmanifest">
<title>Arena Map Sketch</title>
<style>
:root{--bg:#030814;--ink:#66a3ff;--dim:#4068b8;--panel:rgba(5,12,30,.9);}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 15px "Courier New",ui-monospace,monospace;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:fixed;display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--dim);border-radius:6px;z-index:5}
#tools{left:calc(8px + env(safe-area-inset-left));top:50%;transform:translateY(-50%);flex-direction:column;max-height:calc(100% - 100px);overflow:auto}
#top{top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);align-items:center;max-width:calc(100% - 16px);overflow:auto}
#inks{right:calc(8px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);flex-direction:column}
button{font:inherit;color:var(--ink);background:rgba(102,163,255,.07);border:1px solid var(--dim);border-radius:4px;min-width:52px;min-height:46px;padding:4px 8px;letter-spacing:.04em;cursor:pointer}
button.on{background:rgba(102,163,255,.28);border-color:var(--ink);box-shadow:0 0 10px rgba(102,163,255,.55),inset 0 0 8px rgba(102,163,255,.3);color:#fff}
button:active{background:rgba(102,163,255,.4)}
button small{display:block;font-size:10px;opacity:.7;font-weight:400}
.sw{min-width:46px;padding:0;border-width:2px}
.sw.on{box-shadow:0 0 12px currentColor}
.sep{width:1px;background:var(--dim);margin:0 2px;align-self:stretch;opacity:.5}
#hint{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:var(--dim);font-size:12px;pointer-events:none;z-index:4;text-align:center}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--ink);padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar" id="top"></div>
<div class="bar" id="tools"></div>
<div class="bar" id="inks"></div>
<div id="hint">Pencil draws · two fingers pan / pinch zoom</div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("c");let ctx=cv.getContext("2d",{alpha:false,desynchronized:true});const mainCtx=ctx;
const INKS=[["#5ff0ff","Cyan"],["#ff8c1f","Warden"],["#ffe026","Hive"],["#ff4de6","Dusk"],["#ad59ff","Void"],["#40ff80","Lich"],["#ff3359","Devourer"],["#e6ebff","Silver"]];
const GATE="#3fd6c4",GRID=40;
let S={cam:{x:0,y:0,z:.5},shapes:[],tool:"pen",ink:0,snap:true,fill:true,finger:false,size:1,grid:true};
let undo=[],redo=[];
try{const j=JSON.parse(localStorage.getItem("mapsketch")||"null");if(j){S.shapes=j.shapes||[];S.cam=j.cam||S.cam;S.ink=j.ink||0}}catch(e){}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem("mapsketch",JSON.stringify({shapes:S.shapes,cam:S.cam,ink:S.ink}))}catch(e){}},500)}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}

/* ---------- UI ---------- */
const TOOLS=[["pen","Pen","free"],["line","Line","wall"],["rect","Room","box"],["ell","Circle","arena"],["pillar","Pillar","solid"],["gate","Gate","door"],["spawn","Spawn","pt"],["label","Text","abc"],["erase","Erase","x"],["hand","Move","pan"]];
const tools=$("tools");
TOOLS.forEach(([id,n,s])=>{const b=document.createElement("button");b.dataset.t=id;b.innerHTML=n+"<small>"+s+"</small>";b.onclick=()=>{S.tool=id;ui()};tools.appendChild(b)});
const inks=$("inks");
INKS.forEach(([c,n],i)=>{const b=document.createElement("button");b.className="sw";b.style.color=b.style.background=c;b.style.background=c+"33";b.style.borderColor=c;b.title=n;b.onclick=()=>{S.ink=i;ui();save()};inks.appendChild(b)});
const topBar=$("top");
function tb(label,fn,id){const b=document.createElement("button");b.innerHTML=label;b.onclick=fn;if(id)b.id=id;topBar.appendChild(b);return b}
tb("Undo",()=>doUndo());tb("Redo",()=>doRedo());
topBar.appendChild(Object.assign(document.createElement("div"),{className:"sep"}));
tb("Snap",()=>{S.snap=!S.snap;ui()},"bSnap");tb("Fill",()=>{S.fill=!S.fill;ui();draw()},"bFill");tb("Grid",()=>{S.grid=!S.grid;ui();draw()},"bGrid");
tb("Size",()=>{S.size=S.size%3+1;ui()},"bSize");tb("Finger",()=>{S.finger=!S.finger;ui()},"bFinger");
topBar.appendChild(Object.assign(document.createElement("div"),{className:"sep"}));
tb("Fit",()=>fit());tb("PNG",()=>exportPng());tb("Save",()=>exportJson());tb("Open",()=>$("file").click());
tb("Clear",()=>{if(S.shapes.length&&confirm("Clear the whole map?")){push();S.shapes=[];draw();save()}});
function ui(){
 [...tools.children].forEach(b=>b.classList.toggle("on",b.dataset.t===S.tool));
 [...inks.children].forEach((b,i)=>b.classList.toggle("on",i===S.ink));
 $("bSnap").classList.toggle("on",S.snap);$("bFill").classList.toggle("on",S.fill);$("bGrid").classList.toggle("on",S.grid);
 $("bFinger").classList.toggle("on",S.finger);$("bSize").innerHTML="Size<small>"+["thin","normal","thick"][S.size-1]+"</small>";
 $("hint").textContent=S.finger?"Finger and Pencil both draw · two fingers pan / zoom":"Pencil draws · one finger pans · two fingers zoom";
}

/* ---------- history ---------- */
function push(){undo.push(S.shapes);if(undo.length>200)undo.shift();redo=[]}
function doUndo(){if(!undo.length)return;redo.push(S.shapes);S.shapes=undo.pop();draw();save()}
function doRedo(){if(!redo.length)return;undo.push(S.shapes);S.shapes=redo.pop();draw();save()}
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="z"){e.preventDefault();e.shiftKey?doRedo():doUndo()}});

/* ---------- geometry ---------- */
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;draw()}
addEventListener("resize",resize);
const toWorld=(sx,sy)=>({x:(sx-W/2)/S.cam.z+S.cam.x,y:(sy-H/2)/S.cam.z+S.cam.y});
const snapv=v=>Math.round(v/GRID)*GRID;
function pt(e,snap){let p=toWorld(e.clientX,e.clientY);if(snap&&S.snap)p={x:snapv(p.x),y:snapv(p.y)};return p}
const lw=()=>[1.6,2.6,4.2][S.size-1];
function bounds(sh){
 let xs=[],ys=[];
 if(sh.t==="pillar"||sh.t==="spawn"||sh.t==="label"){return{x0:sh.x-(sh.r||40),y0:sh.y-(sh.r||40),x1:sh.x+(sh.r||40),y1:sh.y+(sh.r||40)}}
 const P=sh.pts;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const p of P){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}
 return{x0,y0,x1,y1};
}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
function polyOf(sh){
 if(sh.t==="rect"){const[a,b]=sh.pts;return[a,{x:b.x,y:a.y},b,{x:a.x,y:b.y},a]}
 if(sh.t==="ell"){const[a,b]=sh.pts,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,rx=Math.abs(b.x-a.x)/2,ry=Math.abs(b.y-a.y)/2,o=[];for(let i=0;i<=40;i++){const q=i/40*Math.PI*2;o.push({x:cx+Math.cos(q)*rx,y:cy+Math.sin(q)*ry})}return o}
 return sh.pts;
}
function hit(sh,p,tol){
 if(sh.t==="pillar"||sh.t==="spawn")return Math.hypot(p.x-sh.x,p.y-sh.y)<=sh.r+tol;
 if(sh.t==="label")return Math.abs(p.x-sh.x)<sh.s*sh.txt.length*.3+tol&&Math.abs(p.y-sh.y)<sh.s*.6+tol;
 const P=polyOf(sh);
 for(let i=0;i<P.length-1;i++)if(segDist(p,P[i],P[i+1])<tol)return true;
 return false;
}

/* ---------- drawing ---------- */
function hex(c,a){return c+Math.round(a*255).toString(16).padStart(2,"0")}
function tracePoly(P,closed,smooth){
 ctx.beginPath();
 if(!smooth||P.length<3){ctx.moveTo(P[0].x,P[0].y);for(const p of P)ctx.lineTo(p.x,p.y);if(closed)ctx.closePath();return}
 ctx.moveTo(P[0].x,P[0].y);
 for(let i=1;i<P.length-1;i++){const m={x:(P[i].x+P[i+1].x)/2,y:(P[i].y+P[i+1].y)/2};ctx.quadraticCurveTo(P[i].x,P[i].y,m.x,m.y)}
 const l=P[P.length-1];ctx.lineTo(l.x,l.y);if(closed)ctx.closePath();
}
function hatch(P,c,a,sm){
 ctx.save();tracePoly(P,true,sm);ctx.clip();
 const b=bounds({pts:P}),sp=Math.max(16,Math.ceil(11/S.cam.z/8)*8);
 ctx.strokeStyle=hex(c,.28*a);ctx.lineWidth=1/S.cam.z;ctx.beginPath();
 for(let d=Math.floor((b.x0-b.y1)/sp)*sp;d<b.x1-b.y0;d+=sp){ctx.moveTo(d+b.y0,b.y0);ctx.lineTo(d+b.y1,b.y1)}
 ctx.stroke();ctx.fillStyle=hex(c,.07*a);ctx.fill();ctx.restore();
}
function neon(P,c,w,closed,a=1,dash,sm){
 const z=S.cam.z,k=w/z;
 ctx.lineJoin="round";ctx.lineCap="round";
 if(dash)ctx.setLineDash(dash);
 for(const[m,al,col]of[[6,.12,c],[2.6,.4,c],[.9,.95,"#ffffff"]]){
  tracePoly(P,closed,sm);ctx.strokeStyle=hex(col,al*a);ctx.lineWidth=m*k*(m<1?1:1);ctx.stroke();
 }
 ctx.setLineDash([]);
}
function drawShape(sh,a=1){
 const c=INKS[sh.ink][0],w=sh.w||2.6;
 switch(sh.t){
  case"path":{const P=sh.pts;if(sh.closed&&sh.fill)hatch(P,c,a,true);neon(P,c,w,sh.closed,a,null,true);break}
  case"line":neon(sh.pts,c,w,false,a);break;
  case"rect":case"ell":{const P=polyOf(sh);if(sh.fill)hatch(P,c,a);neon(P,c,w,true,a);break}
  case"pillar":{const P=[];for(let i=0;i<=24;i++){const q=i/24*Math.PI*2;P.push({x:sh.x+Math.cos(q)*sh.r,y:sh.y+Math.sin(q)*sh.r})}hatch(P,c,a);neon(P,c,w,true,a);break}
  case"gate":{const[p,q]=sh.pts;neon([p,q],GATE,w,false,a,[10/S.cam.z,7/S.cam.z]);for(const e of[p,q]){ctx.beginPath();ctx.arc(e.x,e.y,5/S.cam.z,0,7);ctx.fillStyle=hex(GATE,.9*a);ctx.fill()}break}
  case"spawn":{const P=[];for(let i=0;i<=24;i++){const q=i/24*Math.PI*2;P.push({x:sh.x+Math.cos(q)*sh.r,y:sh.y+Math.sin(q)*sh.r})}
   neon(P,c,w,true,a);neon([{x:sh.x-sh.r*1.5,y:sh.y},{x:sh.x-sh.r*.5,y:sh.y}],c,w*.7,false,a);neon([{x:sh.x+sh.r*.5,y:sh.y},{x:sh.x+sh.r*1.5,y:sh.y}],c,w*.7,false,a);
   neon([{x:sh.x,y:sh.y-sh.r*1.5},{x:sh.x,y:sh.y-sh.r*.5}],c,w*.7,false,a);neon([{x:sh.x,y:sh.y+sh.r*.5},{x:sh.x,y:sh.y+sh.r*1.5}],c,w*.7,false,a);break}
  case"label":ctx.font="600 "+sh.s+"px 'Courier New',monospace";ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.shadowColor=c;ctx.shadowBlur=10;ctx.fillStyle=hex(c,a);ctx.fillText(sh.txt,sh.x,sh.y);ctx.shadowBlur=0;break;
 }
}
let live=null,hover=null;
let liveCv=null,liveCx=null;
function liveReset(){
 if(!liveCv){liveCv=document.createElement("canvas");liveCx=liveCv.getContext("2d")}
 if(liveCv.width!==Math.round(W*dpr)||liveCv.height!==Math.round(H*dpr)){liveCv.width=Math.round(W*dpr);liveCv.height=Math.round(H*dpr)}
 liveCx.setTransform(1,0,0,1,0,0);liveCx.clearRect(0,0,liveCv.width,liveCv.height);
}
function liveSeg(a,b){ // one cheap opaque segment of the stroke being drawn (smoothed + glowed when it is finished)
 const z=S.cam.z,c=INKS[S.ink][0],k=lw(),x=liveCx;
 x.setTransform(dpr,0,0,dpr,0,0);x.lineCap=x.lineJoin="round";
 const A=[(a.x-S.cam.x)*z+W/2,(a.y-S.cam.y)*z+H/2],B=[(b.x-S.cam.x)*z+W/2,(b.y-S.cam.y)*z+H/2];
 for(const[w,col]of[[3.2*k,c],[1.1*k,"#ffffff"]]){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke()}
}
let raf=0,cache=null,cacheShapes=null,cacheGrid=null,cacheCam=null,camTimer=0;
function draw(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})}
function buildCache(){
 if(!cache)cache=document.createElement("canvas");
 cache.width=Math.round(W*dpr);cache.height=Math.round(H*dpr);
 ctx=cache.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle="#030814";ctx.fillRect(0,0,W,H);
 const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,"rgba(40,90,170,.14)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const z=S.cam.z;ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-S.cam.x,-S.cam.y);
 if(S.grid)drawGrid();
 for(const sh of S.shapes)drawShape(sh);
 ctx.restore();ctx=mainCtx;
 cacheShapes=S.shapes;cacheGrid=S.grid;cacheCam={...S.cam};
}
function render(){
 const z=S.cam.z;
 if(!cache||cacheShapes!==S.shapes||cacheGrid!==S.grid||cache.width!==Math.round(W*dpr)||cache.height!==Math.round(H*dpr))buildCache();
 const c=cacheCam;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(c.x!==S.cam.x||c.y!==S.cam.y||c.z!==z){
  // reuse the stale bitmap while panning / zooming, re-render sharp once idle
  const r=z/c.z;ctx.fillStyle="#030814";ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*r,0,0,dpr*r,dpr*((c.x-S.cam.x)*z+W/2-r*W/2),dpr*((c.y-S.cam.y)*z+H/2-r*H/2));
  ctx.drawImage(cache,0,0,W,H);ctx.setTransform(dpr,0,0,dpr,0,0);
  clearTimeout(camTimer);camTimer=setTimeout(()=>{buildCache();draw()},140);
 }else ctx.drawImage(cache,0,0,W,H);
 if(drawing&&drawing.t==="pen"&&liveCv)ctx.drawImage(liveCv,0,0,W,H);
 else if(live){ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-S.cam.x,-S.cam.y);drawShape(live,.9);ctx.restore()}
}
function drawGrid(){
 const z=S.cam.z,x0=S.cam.x-W/2/z,x1=S.cam.x+W/2/z,y0=S.cam.y-H/2/z,y1=S.cam.y+H/2/z;
 const step=z<.25?GRID*4:GRID;
 ctx.fillStyle="rgba(102,163,255,.28)";const r=1.3/z;
 for(let x=Math.floor(x0/step)*step;x<x1;x+=step)for(let y=Math.floor(y0/step)*step;y<y1;y+=step){
  const big=(x%(step*5)===0&&y%(step*5)===0);ctx.fillRect(x-r*(big?1.6:1),y-r*(big?1.6:1),r*(big?3.2:2),r*(big?3.2:2))}
 // origin axes
 ctx.strokeStyle="rgba(102,163,255,.16)";ctx.lineWidth=1/z;ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x1,0);ctx.moveTo(0,y0);ctx.lineTo(0,y1);ctx.stroke();
}

/* ---------- input ---------- */
const ptrs=new Map();let drawing=null,gesture=null,erased=false;
cv.addEventListener("pointerdown",e=>{
 cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);
 const isPen=e.pointerType==="pen"||e.pointerType==="mouse"||S.finger;
 if(ptrs.size>=2){cancelDraw();startGesture();return}
 if(e.pointerType==="touch"&&!isPen||S.tool==="hand"){gesture={pan:true,sx:e.clientX,sy:e.clientY,cx:S.cam.x,cy:S.cam.y};return}
 begin(e);
});
cv.addEventListener("pointermove",e=>{
 if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,e);
 if(gesture){moveGesture(e);return}
 if(drawing){const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const q of(ev.length?ev:[e]))move(q)}
});
function end(e){
 if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(gesture){if(ptrs.size<2&&!gesture.pan){gesture=null}else if(ptrs.size===0)gesture=null;if(!ptrs.size)gesture=null;save();return}
 if(drawing)finish(e);
}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",e=>{cancelDraw();end(e)});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));save()},{passive:false});
["gesturestart","gesturechange","contextmenu","selectstart"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
function zoomAt(sx,sy,f){const w=toWorld(sx,sy);S.cam.z=Math.max(.05,Math.min(6,S.cam.z*f));S.cam.x=w.x-(sx-W/2)/S.cam.z;S.cam.y=w.y-(sy-H/2)/S.cam.z;draw()}
function startGesture(){
 const[a,b]=[...ptrs.values()];
 gesture={pan:false,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};
}
function moveGesture(e){
 if(gesture.pan){S.cam.x=gesture.cx-(e.clientX-gesture.sx)/S.cam.z;S.cam.y=gesture.cy-(e.clientY-gesture.sy)/S.cam.z;draw();return}
 if(ptrs.size<2)return;
 const[a,b]=[...ptrs.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
 S.cam.x-=(mx-gesture.mx)/S.cam.z;S.cam.y-=(my-gesture.my)/S.cam.z;
 zoomAt(mx,my,d/gesture.d);gesture.d=d;gesture.mx=mx;gesture.my=my;
}
function cancelDraw(){drawing=null;live=null;draw()}
function begin(e){
 const t=S.tool,p=pt(e,t!=="pen"&&t!=="erase");
 if(t==="erase"){push();erased=false;drawing={t};eraseAt(p);return}
 if(t==="spawn"){addShape({t:"spawn",x:p.x,y:p.y,r:24,ink:S.ink,w:lw()});return}
 if(t==="pillar"){drawing={t,p0:p};live={t:"pillar",x:p.x,y:p.y,r:GRID/2,ink:S.ink,w:lw()};draw();return}
 if(t==="label"){const s=prompt("Label text");if(s)addShape({t:"label",x:p.x,y:p.y,txt:s.slice(0,40),s:28,ink:S.ink});return}
 drawing={t,p0:p,raw:[p]};if(t==="pen")liveReset();
 live={t:t==="pen"?"path":t,pts:[p,p],ink:S.ink,w:lw(),fill:S.fill};draw();
}
function move(e){
 const t=drawing.t,p=pt(e,t!=="pen"&&t!=="erase");
 if(t==="erase"){eraseAt(p);return}
 if(t==="pillar"){live.r=Math.max(GRID/4,S.snap?snapv(Math.hypot(p.x-drawing.p0.x,p.y-drawing.p0.y)):Math.hypot(p.x-drawing.p0.x,p.y-drawing.p0.y));draw();return}
 if(t==="pen"){const l=drawing.raw[drawing.raw.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)*S.cam.z>4){drawing.raw.push(p);live.pts=drawing.raw;liveSeg(l,p)}}
 else if(t==="line"||t==="gate"){let q=p;if(e.shiftKey)q=p;live.pts=[drawing.p0,q]}
 else live.pts=[drawing.p0,p];
 draw();
}
function finish(e){
 const d=drawing;drawing=null;
 if(d.t==="erase"){if(erased){draw();save()}else undo.pop();return}
 if(!live){return}
 const sh=live;live=null;
 if(d.t==="pillar"){addShape(sh);return}
 if(d.t==="pen"){
  const P=simplify(d.raw,1.2/S.cam.z);
  if(P.length<2){draw();return}
  sh.pts=P;
  const a=P[0],b=P[P.length-1];
  if(P.length>5&&Math.hypot(a.x-b.x,a.y-b.y)<28/S.cam.z){sh.closed=true;sh.pts=P.slice(0,-1)}
  addShape(sh);return;
 }
 const[a,b]=sh.pts;
 if(Math.hypot(a.x-b.x,a.y-b.y)*S.cam.z<6){draw();return}
 if(d.t==="gate")sh.ink=0;
 addShape(sh);
}
function addShape(sh){
 push();const old=S.shapes;S.shapes=[...old,sh];
 if(cache&&cacheShapes===old&&cacheCam.x===S.cam.x&&cacheCam.y===S.cam.y&&cacheCam.z===S.cam.z){
  const c=cache.getContext("2d");ctx=c;ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.translate(W/2,H/2);ctx.scale(S.cam.z,S.cam.z);ctx.translate(-S.cam.x,-S.cam.y);
  drawShape(sh);ctx.restore();ctx=mainCtx;cacheShapes=S.shapes;
 }
 draw();save();
}
function eraseAt(p){
 const tol=14/S.cam.z;
 for(let i=S.shapes.length-1;i>=0;i--)if(hit(S.shapes[i],p,tol)){S.shapes=S.shapes.filter((_,j)=>j!==i);erased=true;break}
 draw();
}
function simplify(P,eps){
 if(P.length<3)return P;
 let dm=0,ix=0;const a=P[0],b=P[P.length-1];
 for(let i=1;i<P.length-1;i++){const d=segDist(P[i],a,b);if(d>dm){dm=d;ix=i}}
 if(dm>eps){const l=simplify(P.slice(0,ix+1),eps),r=simplify(P.slice(ix),eps);return l.slice(0,-1).concat(r)}
 return[a,b];
}

/* ---------- view / export ---------- */
function allBounds(){
 if(!S.shapes.length)return null;
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const sh of S.shapes){const b=bounds(sh);x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1)}
 return{x0,y0,x1,y1};
}
function fit(){
 const b=allBounds();if(!b){S.cam={x:0,y:0,z:.5};draw();return}
 const w=Math.max(b.x1-b.x0,100),h=Math.max(b.y1-b.y0,100);
 S.cam.x=(b.x0+b.x1)/2;S.cam.y=(b.y0+b.y1)/2;S.cam.z=Math.min((W-240)/w,(H-200)/h,2);draw();save();
}
function exportPng(){
 const b=allBounds();if(!b){toast("Nothing to export");return}
 const pad=80,w=b.x1-b.x0+pad*2,h=b.y1-b.y0+pad*2,sc=Math.min(2,4096/Math.max(w,h));
 const oc=document.createElement("canvas");oc.width=Math.round(w*sc);oc.height=Math.round(h*sc);
 const c=oc.getContext("2d"),camKeep=S.cam;
 c.fillStyle="#030814";c.fillRect(0,0,oc.width,oc.height);
 ctx=c;S.cam={x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2,z:sc};
 c.translate(oc.width/2,oc.height/2);c.scale(sc,sc);c.translate(-S.cam.x,-S.cam.y);
 for(const sh of S.shapes)drawShape(sh);
 ctx=mainCtx;S.cam=camKeep;
 oc.toBlob(async bl=>{
  const f=new File([bl],"arena-map.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Arena map"});return}catch(e){if(e.name==="AbortError")return}}
  dl(bl,"arena-map.png");
 },"image/png");
}
function dl(bl,name){const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function exportJson(){
 const bl=new Blob([JSON.stringify({v:1,shapes:S.shapes},null,1)],{type:"application/json"});
 const f=new File([bl],"arena-map.json",{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Arena map"});return}catch(e){if(e.name==="AbortError")return}}
 dl(bl,"arena-map.json");
}
$("file").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(!Array.isArray(j.shapes))throw 0;push();S.shapes=j.shapes;fit();toast("Opened "+f.name)}catch(_){toast("Not a map file")}
 e.target.value="";
};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
ui();resize();
</script>

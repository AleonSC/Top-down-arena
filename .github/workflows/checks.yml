name: checks
on:
  pull_request:
  merge_group:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-mono
      - name: Compile check
        run: Tools/CompileCheck/check.sh
      - name: Core suite
        run: Tools/SimTest/run.sh
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-mono
      - name: Feature suite
        run: Tools/SimTest/run.sh 1 30 features
  # The suites neither job above runs (Program.cs CiExtras), split into shards that run beside them.
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-mono
      - name: Extra suites ${{ matrix.shard }}
        run: Tools/SimTest/extras.sh ${{ matrix.shard }}
  # The branch ruleset requires a check named `checks`: it passes only when every job above does.
  checks:
    if: always()
    needs: [core, features, extras]
    runs-on: ubuntu-latest
    steps:
      - name: All suites passed
        run: |
          [ "${{ needs.core.result }}" = success ] && [ "${{ needs.features.result }}" = success ] && [ "${{ needs.extras.result }}" = success ]

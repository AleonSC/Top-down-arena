name: checks
on:
  pull_request:
  merge_group:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-mcs mono-runtime libmono-system-core4.0-cil
      - name: Compile check
        run: Tools/CompileCheck/check.sh
      - name: Core suite
        run: Tools/SimTest/run.sh
      - name: Feature suite
        run: Tools/SimTest/run.sh 1 30 features

name: wavelab-release
# Publishes the single-file Wave Lab app (WaveLab.exe) as the "wave-lab" release (always the latest main).
on:
  push:
    branches: [main]
    paths: ['Assets/Scripts/Core/**', 'Tools/WaveLab/**', '.github/workflows/wavelab-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install mono
        run: |
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y mono-mcs mono-runtime libmono-system-core4.0-cil libmono-system4.0-cil zip && break
            echo "apt failed (try $i), retrying"; sleep 20
          done
      - name: Build app
        run: Tools/WaveLab/package.sh "$GITHUB_WORKSPACE/out"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wave-lab --yes --cleanup-tag || true
          gh release create wave-lab out/WaveLab.exe --title "Wave Lab (latest)" --notes "Wave Lab app, built from main ($GITHUB_SHA). Windows: download and double-click (nothing to install; SmartScreen may ask: More info, Run anyway). Mac/Linux: mono WaveLab.exe."

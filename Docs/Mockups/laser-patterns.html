<!doctype html><meta charset="utf-8"><title>Laser patterns (mockup)</title>
<body style="margin:0;background:#070b14"><canvas id="c" width="1260" height="860"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=400,P=6.4,TAU=Math.PI*2;
const names=['1 SWEEP RAIL','2 TWIN SWEEP (anti-phase)','3 SPINNER (2 arms)','4 CROSS (4 arms, slow)','5 LANE SCAN (up/down + gap)','6 BLINK LANES (telegraph, fire)'];
function beam(a,b,w,al=1){x.save();x.globalAlpha=al;x.lineCap='round';x.strokeStyle='#ff3b50';x.shadowColor='#ff3b50';x.shadowBlur=18;x.lineWidth=w*2.4;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=w*.7;x.stroke();x.restore();}
function emit(px,py){x.fillStyle='#14202c';x.strokeStyle='#ff3b50';x.lineWidth=3;x.beginPath();x.arc(px,py,10,0,TAU);x.fill();x.stroke();}
function pit(px,py,w,h){x.fillStyle='#05030c';x.strokeStyle='#a040ff';x.lineWidth=2;x.beginPath();x.roundRect(px,py,w,h,8);x.fill();x.stroke();}
function tri(t,p){const k=(t%p)/p;return k<.5?k*2:2-k*2;}
const pits={0:[[40,40,70,90],[290,270,70,90]],1:[[150,40,60,70],[190,290,60,70]],2:[[40,40,60,60],[300,300,60,60]],3:[[40,300,60,60],[300,40,60,60]],4:[[160,170,80,60]],5:[[40,170,50,60],[310,170,50,60]]};
function panel(i,t){x.save();x.translate(20+(i%3)*(S+20),20+Math.floor(i/3)*(S+60));
 x.fillStyle='#0b1224';x.fillRect(0,0,S,S);x.strokeStyle='#12203a';for(let g=0;g<=S;g+=50){x.beginPath();x.moveTo(g,0);x.lineTo(g,S);x.moveTo(0,g);x.lineTo(S,g);x.stroke();}
 x.strokeStyle='#39d0f0';x.lineWidth=3;x.strokeRect(0,0,S,S);
 x.save();x.beginPath();x.rect(0,0,S,S);x.clip();
 for(const p of pits[i])pit(...p);
 if(i==0){const px=30+tri(t,3.2)*(S-60);beam([px,0],[px,S],5);}
 if(i==1){const a=30+tri(t,3.2)*(S-60),b=S-a;beam([a,0],[a,S],5);beam([b,0],[b,S],5);}
 if(i==2){const r=t/P*TAU;emit(200,200);for(const d of[0,Math.PI]){beam([200,200],[200+Math.cos(r+d)*300,200+Math.sin(r+d)*300],5);}}
 if(i==3){const r=-t/P*TAU*.5*1;emit(200,200);for(let k=0;k<4;k++){const d=k*Math.PI/2;beam([200,200],[200+Math.cos(r+d)*300,200+Math.sin(r+d)*300],4);}}
 if(i==4){const y=tri(t,3.2)*(S-100);// 2 rails with a 100 gap, moving
  const g=30+y;beam([0,g-20+0],[S,g-20],5);const g2=g+120;beam([0,g2],[S,g2],5);}
 if(i==5){for(let k=0;k<4;k++){const px=50+k*100,ph=((t+k*1.6)%P)/P*4;// 0-1 off, 1-2 telegraph, 2-3 fire
   const n=ph%4;const ly=px;
   if(n>=1&&n<2){x.save();x.setLineDash([6,10]);x.strokeStyle='#ff3b50';x.globalAlpha=.4+.4*Math.sin(t*12);x.lineWidth=2;x.beginPath();x.moveTo(ly,0);x.lineTo(ly,S);x.stroke();x.restore();}
   else if(n>=2&&n<3)beam([ly,0],[ly,S],6);}}
 x.restore();
 x.fillStyle='#ffa030';x.font='bold 14px monospace';x.fillText('▣ turret',8,S-10);
 x.fillStyle='#ff9aa6';x.font='15px monospace';x.fillText(names[i],0,S+24);
 x.restore();}
function draw(t){x.fillStyle='#070b14';x.fillRect(0,0,c.width,c.height);for(let i=0;i<6;i++)panel(i,t);
 x.fillStyle='#789';x.font='13px monospace';x.fillText('mockup: one 600px cell shown at 400px; purple = void pit, red = laser, loop 6.4s',20,c.height-8);}
window.draw=draw;const q=new URLSearchParams(location.search).get('t');
if(q!==null)draw(parseFloat(q));else{(function f(n){draw(n/1000%P);requestAnimationFrame(f)})(0);}
</script>

<title>Green Terminal Level Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Rajdhani:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{--f-crt:"VT323","Courier New",monospace;--f-ui:"Rajdhani",system-ui,sans-serif;--page:#020a05;--sbg:#03110a;--ink:#4dff9a;--ink-hi:#d2ffe6;--dim:#2fa66a;--rim:#0d2417;--grid:rgba(60,255,150,.06);
--glow:rgba(60,255,150,.6);--glow2:rgba(60,255,150,.3);--glow3:rgba(60,255,150,.12);--edge:color-mix(in srgb,#4dff9a 55%,transparent);--card1:color-mix(in srgb,#4dff9a 7%,#03110a);--card2:#03110a;--icobg:color-mix(in srgb,#03110a 70%,#000);
--shade:rgba(0,0,0,.55);--head:#b6ff6a;--gold:#f2c14e;--soft:#c2ccea;color-scheme:dark;--f-ui:"IBM Plex Mono",ui-monospace,monospace;}
.ds{font-size:1.1cqw;font-weight:400;line-height:1.5}.sub{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:.2em}
.nm::before{content:"> ";opacity:.6}.nm{text-transform:uppercase;letter-spacing:.03em;font-size:2.3cqw}
.card.sel .nm::after{content:"_";animation:blink 1s steps(1) infinite}
.pips i{width:1cqw;height:1cqw}.card.sel .pips i:first-child{background:transparent}
.tag::before{content:"[ "}.tag::after{content:" ]"}.tag{border:0;background:none!important;color:var(--ink)!important;padding-inline:0}
.card.sel .tag{background:none;color:var(--ink-hi)!important}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--f-ui);color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
.bar button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--dim);padding:5px 10px;cursor:pointer}
.bar button:hover{background:var(--ink);color:var(--sbg)}.bar button:focus-visible{outline:2px solid var(--ink-hi);outline-offset:2px}
.stage{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--sbg);isolation:isolate;border:1px solid var(--rim)}
.stage button{cursor:pointer}
/* faint game behind the menu */
.arena{position:absolute;inset:0;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/4cqw 4cqw,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/4cqw 4cqw,var(--sbg)}
.pillar{position:absolute;width:3.6cqw;height:3.6cqw;border-radius:50%;border:1px solid var(--rim)}
.hint{position:absolute;right:1.4cqw;top:1.2cqw;font:500 .82cqw var(--f-ui);color:var(--dim);letter-spacing:.05em}
.hud{position:absolute;left:0;right:0;bottom:0;height:6.6cqw;padding:.8cqw 1.2cqw;display:flex;gap:.8cqw;border-top:1px solid var(--rim)}
.hud .wave{width:12cqw;font:500 .8cqw var(--f-ui);color:var(--dim);display:flex;flex-direction:column;justify-content:space-between}
.hud .wave b{font:400 2.2cqw/1 var(--f-crt);color:var(--ink)}
.slot{flex:1;border:1px solid var(--rim);padding:.5cqw .7cqw;font:500 .8cqw var(--f-ui);color:var(--dim);display:flex;flex-direction:column;gap:.2cqw;justify-content:center}
.slot b{font:400 1.5cqw/1 var(--f-crt);color:var(--dim)}
.slot.rdy{border-color:var(--dim)}.slot.rdy b{color:var(--ink)}
.who{width:19cqw;border:1px solid var(--rim);padding:.5cqw .8cqw;font:500 .8cqw var(--f-ui);color:var(--dim);display:flex;flex-direction:column;justify-content:center;gap:.4cqw}
.who b{font:400 1.5cqw/1 var(--f-crt);color:var(--ink)}
.who .hp{height:.6cqw;background:var(--rim)}.who .hp i{display:block;height:100%;background:#3ddc6a}
.dim{position:absolute;inset:0;background:var(--shade);z-index:2}
/* menu */
.menu{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:2.4cqw}
h1{height:5cqw;display:flex;align-items:center;font:400 6.4cqw/1 var(--f-crt);letter-spacing:.06em;color:var(--ink-hi);text-shadow:0 0 .8cqw var(--glow),0 0 2.2cqw var(--glow);animation:titleIn .55s cubic-bezier(.2,1.5,.4,1) both}
h1 i{font-style:normal;animation:blink 1s steps(1) infinite;color:var(--ink)}
.sub{margin-top:.9cqw;font:700 1.15cqw/1 var(--f-ui);letter-spacing:.24em;color:var(--head);animation:fadeIn .5s .15s both}
.cards{margin-top:1.7cqw;display:flex;gap:3.2cqw}
.card{all:unset;box-sizing:border-box;position:relative;width:21cqw;height:29.8cqw;display:flex;flex-direction:column;align-items:center;padding:1.3cqw 1.2cqw 0;color:var(--ink);
 background:linear-gradient(var(--card1),var(--card2));border:2px solid var(--edge);
 box-shadow:0 0 1.4cqw var(--glow2),inset 0 0 1.8cqw var(--glow3);
 transition:transform .38s cubic-bezier(.34,1.9,.5,1),box-shadow .2s,border-color .2s}
.card::before,.card::after{content:"";position:absolute;width:1.5cqw;height:1.5cqw;border:3px solid var(--ink);pointer-events:none}
.card::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.card::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.card.enter{animation:cardIn .7s calc(var(--d)*.1s + .1s) both}
.card:hover{transform:translateY(-.8cqw);border-color:var(--ink);box-shadow:0 0 2.2cqw var(--glow),inset 0 0 2.2cqw var(--glow3)}
.card:focus-visible{outline:2px solid var(--ink-hi);outline-offset:.5cqw}
.card:active{transform:translateY(-.3cqw) scale(.985);transition-duration:.08s}
.card.sel{border-color:var(--ink-hi);box-shadow:0 0 3cqw var(--glow),0 0 .8cqw var(--glow),inset 0 0 2.6cqw var(--glow2);animation:pop .45s cubic-bezier(.3,1.7,.5,1) both,bob 1.9s .45s ease-in-out infinite}
.card.out{animation:cardOut .22s calc(var(--d)*.05s) ease-in both;pointer-events:none}
.tag{font:400 1.25cqw/1 var(--f-crt);letter-spacing:.14em;padding:.35cqw .9cqw .15cqw;border:1px solid var(--ink);color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent);text-shadow:0 0 .5cqw var(--glow)}
.tag.unc{color:var(--gold);border-color:var(--gold);text-shadow:0 0 .5cqw rgba(242,193,78,.55)}
.card.sel .tag{background:var(--ink);color:var(--sbg);text-shadow:none}
.card.sel .tag.unc{background:var(--gold)}
.ico{margin-top:1.5cqw;width:8cqw;height:8cqw;display:grid;place-items:center;border:2px solid var(--edge);background:var(--icobg);transition:box-shadow .2s,border-color .2s}
.card.sel .ico,.card:hover .ico{border-color:var(--ink);box-shadow:0 0 1.4cqw var(--glow)}
.ico svg{width:5cqw;height:5cqw;display:block}
.nm{margin-top:1.5cqw;font:400 2.4cqw/1 var(--f-crt);letter-spacing:.04em;color:var(--ink-hi);text-align:center;text-shadow:0 0 .6cqw var(--glow)}
.ds{margin-top:.9cqw;font:500 1.35cqw/1.3 var(--f-ui);color:var(--soft);text-align:center;max-width:17cqw}
.pips{margin-top:auto;margin-bottom:2.2cqw;display:flex;gap:.7cqw}
.pips i{width:1.1cqw;height:1.1cqw;border:1.5px solid var(--dim)}
.key{margin-top:auto;margin-bottom:1.6cqw;font:400 1.1cqw/1 var(--f-crt);min-width:1.6cqw;text-align:center;padding:.3cqw .45cqw .1cqw;border:1px solid var(--dim);color:var(--dim)}
.pips+.key{margin-top:0}
.ln{align-self:stretch;margin:0 -1.2cqw;height:0;border-top:2px dashed var(--edge);opacity:.9}
.card.sel .ln,.card:hover .ln{border-color:var(--ink)}
/* lobby digital keys */
.acts{margin-top:1cqw;display:flex;gap:1.5cqw}
.k{all:unset;box-sizing:border-box;width:23.4cqw;height:4.2cqw;display:flex;align-items:center;justify-content:center;gap:.9cqw;font:400 2.3cqw/1 var(--f-crt);letter-spacing:.05em;padding-top:.25cqw;color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent);border:2px solid var(--ink);text-shadow:0 0 .6cqw var(--glow);white-space:nowrap;transition:background .08s,color .08s,transform .08s;animation:fadeIn .5s .5s both}
.k:hover:not(.lock),.k.on{background:var(--ink);color:var(--sbg);text-shadow:none}
.k:active:not(.lock){transform:translateY(.15cqw)}
.k:focus-visible{outline:2px solid var(--ink-hi);outline-offset:.35cqw}
.k svg{width:1.8cqw;height:1.8cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;margin-top:-.25cqw}
.k small{font:400 1.2cqw/1 var(--f-crt);color:var(--dim);text-shadow:none}.k:hover:not(.lock) small{color:var(--sbg)}
.lamp{width:1cqw;height:1cqw;flex:none;background:#3dff8a;box-shadow:0 0 .8cqw #3dff8a;margin-top:-.25cqw}
.k.lock{color:var(--dim);border-style:dashed;border-color:var(--dim);background:color-mix(in srgb,var(--dim) 6%,transparent);text-shadow:none;opacity:.75;cursor:not-allowed}
.toast{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0;text-align:center}
.toast span{font:400 5cqw/1.1 var(--f-crt);color:var(--ink-hi);text-shadow:0 0 .8cqw var(--glow),0 0 2.2cqw var(--glow);padding:0 4cqw}
.toast small{display:block;font:700 1.3cqw/1 var(--f-ui);letter-spacing:.24em;color:var(--head);margin-top:1.2cqw;text-shadow:none}
.toast.show{animation:toast 1.1s ease both}
@keyframes titleIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(4cqw) scale(.94)}55%{opacity:1;transform:translateY(-.9cqw) scale(1.02)}78%{transform:translateY(.25cqw)}100%{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-2cqw) scale(.95)}}
@keyframes pop{0%{transform:translateY(0) scale(1)}55%{transform:translateY(-1.5cqw) scale(1.025)}100%{transform:translateY(-.9cqw) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(-.9cqw)}50%{transform:translateY(-1.3cqw)}}
@keyframes blink{50%{opacity:0}}
@keyframes toast{0%{opacity:0;transform:scale(.9)}20%,70%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
@media (max-width:560px){.hud .wave,.who{display:none}}
</style>
<div class="wrap">
<div class="stage" id="stage">
 <div class="arena">
  <i class="pillar" style="left:36%;top:12%"></i><i class="pillar" style="left:56%;top:12%"></i><i class="pillar" style="left:30%;top:42%"></i><i class="pillar" style="left:62%;top:44%"></i><i class="pillar" style="left:41%;top:72%"></i><i class="pillar" style="left:52%;top:72%"></i>
  <div class="hint">HOLD TAB · run stats &amp; build &nbsp;&nbsp; H · hide HUD</div>
  <div class="hud">
   <div class="wave"><span>WAVE</span><b>1 <span style="font-size:1.1cqw;color:var(--dim)">/ 50</span></b><span>SCORE 105</span></div>
   <div class="slot rdy"><span>SPACE &nbsp;READY</span><b>Barrier</b></div>
   <div class="slot"><span>Q</span><b>Empty</b></div><div class="slot"><span>E</span><b>Empty</b></div><div class="slot"><span>SHIFT</span><b>Empty</b></div>
   <div class="slot rdy"><span>ULT · F &nbsp;READY!</span><b>Fortress</b></div>
   <div class="who"><b>Anthony &nbsp;<span style="font:500 .8cqw var(--f-ui);color:var(--dim)">LV 2</span></b><div class="hp"><i></i></div><span>240 / 240</span></div>
  </div>
 </div>
 <div class="dim"></div>
 <div class="menu">
  <h1 id="h1">LEVEL UP!</h1>
  <div class="sub" id="sub">LEVEL 2 · PICK ONE</div>
  <div class="cards" id="cards"></div>
  <div class="acts">
   <button class="k" id="reroll" type="button"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5"/><path d="M5 10h9M10.5 6l4 4-4 4"/></svg>REROLL <small id="rc">×2</small></button>
   <button class="k lock" id="choose" type="button" aria-disabled="true"><i class="lamp" style="display:none"></i><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5"/><path d="M5.5 10.5l3 3 6-7"/></svg>CHOOSE UPGRADE</button>
  </div>
 </div>
 <div class="toast" id="toast"></div>
</div>
<div class="bar"><span>Click a card or press 1 / 2 / 3, then Choose Upgrade (Enter). Reroll with R.</span><span><button id="replay" type="button">Replay intro</button></span></div>
</div>
<script>const ART={"pal": {"k": "#14141e", "w": "#ffffff", "g": "#bec6d7", "G": "#6e768a", "y": "#ffd750", "Y": "#e18c28", "o": "#ff8c28", "r": "#f04040", "R": "#961e28", "p": "#ff80b4", "b": "#5a96ff", "B": "#284bb4", "c": "#8ce6ff", "n": "#64e664", "N": "#288c41", "v": "#b473ff", "V": "#6432a5", "m": "#9b6441", "M": "#5a371e"}, "icons": {"firerate": ["............", ".....kkkkk..", "....kggyyyk.", "gg..kgwyyyyk", "....kggyyyk.", ".ggg.kkkkk..", "............", ".....kkkkk..", "....kggyyyk.", "gg..kgwyyyyk", "....kggyyyk.", ".....kkkkk.."], "hourglass": ["..kkkkkkkk..", "..kGGGGGGk..", "...kyyyyk...", "...kyyyyk...", "....kyyk....", ".....kk.....", ".....kk.....", "....k..k....", "...k.yy.k...", "...kyyyyk...", "..kGGGGGGk..", "..kkkkkkkk.."], "guard_reinforced": [".kkkkkkkkkk.", ".kbbbbbbbbk.", ".kbcbbbbbBk.", ".kwggggggwk.", ".kbbbbbbbBk.", ".kbcbbbbbBk.", "..kwggggwk..", "..kbbbbbBk..", "...kbbbBk...", "....kbBk....", ".....kk.....", "............"], "heart": ["............", "..kkk..kkk..", ".krrrkkrrrk.", "krrwrrrrrrrk", "krwrrrrrrrrk", "krrrrrrrrrrk", ".krrrrrrrrk.", "..krrrrrrk..", "...krrrrk...", "....krrk....", ".....kk.....", "............"], "boot": ["............", "...kkkkk....", "...kmmmk....", "...kmwmk....", "...kmmmk....", "...kmmmk....", "...kmmmkkk..", "...kmmmmmmk.", "..kmmmmmmmmk", "..kMMMMMMMMk", "..kkkkkkkkkk", "............"], "magnum": ["..g......g..", ".gg.kkkk.gg.", "...kyyyyk...", "..kyywyyyk..", "..kywyyyyk..", "..kyyyyyYk..", "..kyyyyyYk..", "..kYyyyyYk..", "...kYYYYk...", ".gg.kkkk.gg.", "..g......g..", "............"], "shield": [".kkkkkkkkkk.", ".kggggggggk.", ".kgwwggggGk.", ".kgwggggGGk.", ".kgggggGGGk.", ".kggggGGGGk.", "..kgggGGGk..", "..kgggGGGk..", "...kggGGk...", "....kgGk....", ".....kk.....", "............"], "bullet": [".....kk.....", "....kyyk....", "...kyywyk...", "...kyywyk...", "...kyyyyk...", "...kYYYYk...", "...kggggk...", "...kgwggk...", "...kgwggk...", "...kggggk...", "...kGGGGk...", "...kkkkkk..."]}};
const POOL=[
{n:'Quick Trigger',d:'+10% fire rate',r:'COMMON',i:'firerate'},
{n:'Focus',d:'-6% ability cooldowns',r:'COMMON',i:'hourglass'},
{n:'Reinforced Guard',d:'Your parry shield takes 25% more before it breaks',r:'COMMON',i:'guard_reinforced',pips:4},
{n:'Sharpened Rounds',d:'+10% damage',r:'COMMON',i:'bullet'},
{n:'Light Boots',d:'+6% move speed',r:'COMMON',i:'boot'},
{n:'Vitality',d:'+15 max HP',r:'COMMON',i:'heart'},
{n:'Thick Skin',d:'Take 10% less damage',r:'UNCOMMON',i:'shield',pips:3},
{n:'Magnum Rounds',d:'Your shots are 15% bigger (area weapons: 15% wider areas)',r:'COMMON',i:'magnum',pips:4}];
let level=2,rerolls=2,sel=-1,seed=0,shown=[0,1,2];
const $=s=>document.querySelector(s);
function icon(k){const g=ART.icons[k];let s='<svg viewBox="0 0 12 12" shape-rendering="crispEdges">';
g.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='.')s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+ART.pal[c]+'"/>'}));return s+'</svg>'}
function render(anim){
 $('#sub').textContent='LEVEL '+level+' · PICK ONE';
 $('#cards').innerHTML=shown.map((pi,i)=>{const c=POOL[pi];
  return '<button class="card'+(anim?' enter':'')+(i===sel?' sel':'')+'" data-i="'+i+'" style="--d:'+i+'" aria-pressed="'+(i===sel)+'">'+
  '<span class="tag'+(c.r==='UNCOMMON'?' unc':'')+'">'+c.r+'</span><span class="ico">'+icon(c.i)+'</span>'+
  '<span class="nm">'+c.n+'</span><span class="ds">'+c.d+'</span>'+
  (c.pips?'<span class="pips">'+'<i></i>'.repeat(c.pips)+'</span>':'')+
  '<span class="key">'+(i+1)+'</span><span class="ln"></span></button>'}).join('');
 $('#reroll').classList.toggle('lock',rerolls<1);$('#rc').textContent='×'+rerolls;
 setChoose();
 if(anim)setTimeout(()=>document.querySelectorAll('.card.enter').forEach(c=>c.classList.remove('enter')),1100);
}
function setChoose(){const b=$('#choose');b.classList.toggle('lock',sel<0);b.querySelector('.lamp').style.display=sel<0?'none':'';b.setAttribute('aria-disabled',sel<0)}
function pick(i){sel=i;document.querySelectorAll('.card').forEach((c,j)=>{c.classList.toggle('sel',j===i);c.setAttribute('aria-pressed',j===i)});setChoose()}
function next3(){const a=[];let k=seed;while(a.length<3){k=(k+1)%POOL.length;if(!a.includes(k))a.push(k)}return a}
function reroll(){if(rerolls<1)return;rerolls--;sel=-1;seed=(seed+3)%POOL.length;
 document.querySelectorAll('.card').forEach(c=>c.classList.add('out'));
 setTimeout(()=>{shown=next3();render(true)},330)}
function choose(){if(sel<0)return;const c=POOL[shown[sel]],t=$('#toast');
 t.innerHTML='<span>'+c.n.toUpperCase()+'<small>UPGRADE ACQUIRED</small></span>';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
 document.querySelectorAll('.card').forEach(x=>x.classList.add('out'));
 setTimeout(()=>{level++;sel=-1;seed=(seed+1)%POOL.length;shown=next3();render(true)},900)}
function replay(){level=2;rerolls=2;sel=-1;seed=0;shown=[0,1,2];const h=$('#h1');h.style.animation='none';void h.offsetWidth;h.style.animation='';render(true)}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(+c.dataset.i);
 if(e.target.closest('#reroll'))reroll();if(e.target.closest('#choose'))choose();
 if(e.target.closest('#replay'))replay();});
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')pick(+e.key-1);else if(e.key==='r'||e.key==='R')reroll();else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')choose()});
render(true);

</script>

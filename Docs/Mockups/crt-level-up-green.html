
<title>Phosphor Level Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--bg:#020a04;--ink:#38e06c;--ink-hi:#b8ffcb;--ink-dim:#1f9a4a;--line:#1f9a4a;--line-dim:#0f4a24;--grid:rgba(56,224,108,.07);--dim:rgba(1,8,3,.62);--accent2:#e8ff7a;
--font-d:"VT323",ui-monospace,monospace;--font-b:"VT323",ui-monospace,monospace;--font-n:"VT323",ui-monospace,monospace;
--h1:6.6cqw;--sub:1.75cqw;--tag:1.3cqw;--nm:2.5cqw;--ds:1.7cqw;--btn:2.3cqw;--rad:2.2cqw;
--h1-shadow:0 0 .6cqw rgba(56,224,108,.9),0 0 2cqw rgba(56,224,108,.55);--txt-shadow:0 0 .5cqw rgba(56,224,108,.8);
--card:linear-gradient(#04140a,#020a04);--card-sel:linear-gradient(#08281500,#06200f);--card-bd:1px solid var(--line);
--card-sh:0 0 1.2cqw rgba(56,224,108,.18),inset 0 0 2cqw rgba(56,224,108,.07);--card-sh-hi:0 0 2cqw rgba(56,224,108,.4),inset 0 0 2.4cqw rgba(56,224,108,.12);--card-sh-sel:0 0 2.6cqw rgba(56,224,108,.6),inset 0 0 3cqw rgba(56,224,108,.2);
--tag-bg:#031208;--ico-bd:1px solid var(--line);--ico-bg:#020d06;--ico-glow:0 0 1.6cqw rgba(56,224,108,.65);--pip-r:0;--ln:repeating-linear-gradient(90deg,var(--ink) 0 .5cqw,transparent .5cqw .9cqw);
--btn-bg:#031208;--btn-bd:1px solid var(--line);--btn-sh:inset 0 0 1.4cqw rgba(56,224,108,.12);--btn-sh-hi:0 0 1.6cqw rgba(56,224,108,.55),inset 0 0 1.6cqw rgba(56,224,108,.2);--btn-hov:#06260f;--go-bg:#0b3a1a;--go-ink:#d8ffe3;
--scan:.34;--vig:.7;--roll:rgba(120,255,160,.07);--flick:#7dffa5}
body{background:#020403}
.card::before,.card::after{content:"";position:absolute;width:1.2cqw;height:1.2cqw;border:2px solid var(--ink);opacity:.9}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
h1::after{content:"";display:inline-block;width:2.6cqw;height:4.2cqw;margin-left:1cqw;background:var(--ink-hi);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn::before{content:">";margin-right:-.4cqw}
.stage{box-shadow:0 0 0 .5cqw #0a0f0b,0 0 0 .7cqw #1b231d}
.crt .glass{box-shadow:inset 0 0 6cqw rgba(0,0,0,.85),inset 0 0 .5cqw rgba(120,255,160,.25)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#040504}
body{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--font-b);color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#8a948c}
.bar .ctl{display:flex;gap:8px;flex-wrap:wrap}
.bar button{font:inherit;color:#c9d2cb;background:#101411;border:1px solid #2a332c;padding:5px 10px;cursor:pointer}
.bar button:hover{border-color:#6c7a6f}.bar button:focus-visible{outline:2px solid #9bd;outline-offset:2px}
.stage{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg);border-radius:var(--rad);isolation:isolate}
.stage *{cursor:default}.stage button,.stage button *{cursor:pointer}
/* fake game behind the menu */
.arena{position:absolute;inset:0;background:
 linear-gradient(var(--grid) 1px,transparent 1px) 0 0/4cqw 4cqw,
 linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/4cqw 4cqw,var(--bg)}
.pillar{position:absolute;width:3.6cqw;height:3.6cqw;border-radius:50%;border:1px solid var(--line-dim)}
.hint{position:absolute;right:1.4cqw;top:1.2cqw;font-size:.82cqw;color:var(--ink-dim);letter-spacing:.05em;z-index:1}
.hud{position:absolute;left:0;right:0;bottom:0;height:6.6cqw;padding:.8cqw 1.2cqw;display:flex;gap:.8cqw;align-items:stretch;z-index:1;border-top:1px solid var(--line-dim)}
.hud .wave{width:12cqw;font-size:.8cqw;color:var(--ink-dim);display:flex;flex-direction:column;justify-content:space-between}
.hud .wave b{font-size:1.8cqw;color:var(--ink);font-weight:400;line-height:1}
.slot{flex:1;border:1px solid var(--line-dim);padding:.5cqw .7cqw;font-size:.8cqw;color:var(--ink-dim);display:flex;flex-direction:column;gap:.3cqw;justify-content:center}
.slot b{font-size:1.15cqw;color:var(--ink-dim);font-weight:400}
.slot.rdy{border-color:var(--line);color:var(--ink)}.slot.rdy b{color:var(--ink)}
.slot.ult{flex:1.1}
.who{width:19cqw;border:1px solid var(--line-dim);padding:.5cqw .8cqw;font-size:.8cqw;color:var(--ink-dim);display:flex;flex-direction:column;justify-content:center;gap:.4cqw}
.who b{font-size:1.1cqw;color:var(--ink);font-weight:400}
.who .hp{height:.7cqw;background:var(--line-dim)}.who .hp i{display:block;height:100%;width:100%;background:var(--ink)}
.dim{position:absolute;inset:0;background:var(--dim);z-index:2}
/* menu */
.menu{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:2.4cqw}
h1{height:5cqw;display:flex;align-items:center;font-family:var(--font-d);font-weight:400;font-size:var(--h1);line-height:1;letter-spacing:.04em;color:var(--ink-hi);text-shadow:var(--h1-shadow);animation:titleIn .55s cubic-bezier(.2,1.4,.4,1) both}
.sub{margin-top:.9cqw;font-size:var(--sub);letter-spacing:.2em;color:var(--ink-dim);animation:fadeIn .5s .15s both}
.cards{margin-top:1.7cqw;display:flex;gap:3.2cqw}
.card{all:unset;box-sizing:border-box;position:relative;width:21cqw;height:29.8cqw;display:flex;flex-direction:column;align-items:center;padding:1.2cqw 1.2cqw 0;background:var(--card);border:var(--card-bd);color:var(--ink);box-shadow:var(--card-sh);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;animation:cardIn .5s calc(var(--d)*.09s + .1s) cubic-bezier(.2,1.2,.4,1) both}
.card:hover{transform:translateY(-.5cqw);box-shadow:var(--card-sh-hi);border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--ink-hi);outline-offset:.4cqw}
.card.sel{transform:translateY(-.9cqw);box-shadow:var(--card-sh-sel);border-color:var(--ink-hi);background:var(--card-sel)}
.card.out{animation:cardOut .22s calc(var(--d)*.05s) ease-in both}
.card:active{transform:translateY(-.2cqw) scale(.99)}
.tag{font-size:var(--tag);letter-spacing:.12em;padding:.25cqw .8cqw;border:1px solid var(--line);color:var(--ink-dim);background:var(--tag-bg)}
.tag.unc{color:var(--accent2);border-color:var(--accent2)}
.ico{margin-top:1.4cqw;width:8cqw;height:8cqw;display:grid;place-items:center;border:var(--ico-bd);background:var(--ico-bg);transition:box-shadow .2s}
.card.sel .ico,.card:hover .ico{box-shadow:var(--ico-glow)}
.ico svg{width:4.8cqw;height:4.8cqw;display:block}
.nm{margin-top:1.6cqw;font-family:var(--font-n);font-size:var(--nm);color:var(--ink-hi);text-align:center;text-shadow:var(--txt-shadow);line-height:1.1}
.ds{margin-top:.9cqw;font-size:var(--ds);color:var(--ink);text-align:center;line-height:1.3;max-width:17cqw}
.pips{margin-top:auto;margin-bottom:2.4cqw;display:flex;gap:.7cqw;min-height:1.1cqw}
.pips i{width:1.1cqw;height:1.1cqw;border:1px solid var(--ink-dim);border-radius:var(--pip-r)}
.key{margin-bottom:1.6cqw;font-size:.85cqw;min-width:1.5cqw;text-align:center;padding:.15cqw .4cqw;border:1px solid var(--line);color:var(--ink-dim);background:var(--tag-bg)}
.card:not(:has(.pips i)) .key{margin-top:auto}
.ln{align-self:stretch;height:.35cqw;margin:0 -1.2cqw;background:var(--ln);opacity:.7;transition:opacity .2s}
.card.sel .ln,.card:hover .ln{opacity:1}
.acts{margin-top:1cqw;display:flex;gap:1.5cqw}
.btn{all:unset;box-sizing:border-box;width:23.4cqw;height:4.2cqw;display:flex;align-items:center;justify-content:center;gap:1cqw;font-family:var(--font-n);font-size:var(--btn);letter-spacing:.1em;color:var(--ink-hi);background:var(--btn-bg);border:var(--btn-bd);box-shadow:var(--btn-sh);transition:transform .1s,box-shadow .15s,background .15s,color .15s,opacity .15s;animation:fadeIn .5s .5s both}
.btn svg{width:1.8cqw;height:1.8cqw;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square}
.btn:hover:not(.off){background:var(--btn-hov);box-shadow:var(--btn-sh-hi);transform:translateY(-.15cqw)}
.btn:active:not(.off){transform:translateY(.15cqw) scale(.99)}
.btn:focus-visible{outline:2px solid var(--ink-hi);outline-offset:.3cqw}
.btn.off{color:var(--ink-dim);opacity:.55;cursor:not-allowed}
.btn.go:not(.off){background:var(--go-bg);color:var(--go-ink);animation:pulse 1.4s ease-in-out infinite}
.btn .x{font-size:.95cqw;color:var(--ink-dim);margin-left:.6cqw}
.toast{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0}
.toast span{font-family:var(--font-d);font-size:var(--h1);color:var(--ink-hi);text-shadow:var(--h1-shadow);text-align:center;line-height:1.3;padding:0 4cqw}
.toast small{display:block;font-family:var(--font-b);font-size:1.5cqw;color:var(--ink);margin-top:1cqw;letter-spacing:.15em;text-shadow:none}
.toast.show{animation:toast 1.1s ease both}
/* CRT layers */
.crt{position:absolute;inset:0;z-index:10;pointer-events:none}
.crt .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,var(--scan)) 0 1px,transparent 1px 3px)}
.crt .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,var(--vig)) 100%)}
.crt .roll{position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(to bottom,transparent,var(--roll),transparent);animation:roll 7s linear infinite}
.crt .flick{position:absolute;inset:0;background:var(--flick);animation:flick .14s steps(2) infinite;opacity:.05}
.crt .glass{position:absolute;inset:0;border-radius:inherit}
.stage.noscan .crt{display:none}
@keyframes titleIn{from{opacity:0;transform:scale(1.25);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(3cqw) scale(.96)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-2cqw) scale(.95)}}
@keyframes pulse{50%{box-shadow:var(--btn-sh-hi)}}
@keyframes roll{to{top:110%}}
@keyframes flick{50%{opacity:.11}}
@keyframes toast{0%{opacity:0;transform:scale(.9)}20%,70%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.crt .roll,.crt .flick,.btn.go:not(.off){animation:none}*{animation-duration:.01s!important;animation-delay:0s!important}}
@media (max-width:560px){.hud .wave,.who{display:none}}
</style>
<div class="wrap">
<div class="stage" id="stage">
 <div class="arena">
  <i class="pillar" style="left:36%;top:12%"></i><i class="pillar" style="left:56%;top:12%"></i><i class="pillar" style="left:30%;top:42%"></i><i class="pillar" style="left:62%;top:44%"></i><i class="pillar" style="left:41%;top:72%"></i><i class="pillar" style="left:52%;top:72%"></i>
  <div class="hint">HOLD TAB · run stats &amp; build &nbsp;&nbsp; H · hide HUD</div>
  <div class="hud">
   <div class="wave"><span>WAVE</span><b>1 <span style="font-size:1.2cqw;color:var(--ink-dim)">/ 50</span></b><span>SCORE 105</span></div>
   <div class="slot rdy"><span>SPACE &nbsp;READY</span><b>Barrier</b></div>
   <div class="slot"><span>Q</span><b>Empty</b></div><div class="slot"><span>E</span><b>Empty</b></div><div class="slot"><span>SHIFT</span><b>Empty</b></div>
   <div class="slot rdy ult"><span>ULT · F &nbsp;READY!</span><b>Fortress</b></div>
   <div class="who"><b>Anthony &nbsp;<span style="font-size:.8cqw;color:var(--ink-dim)">LV 2</span></b><div class="hp"><i></i></div><span>240 / 240</span></div>
  </div>
 </div>
 <div class="dim"></div>
 <div class="menu">
  <h1 id="h1">LEVEL UP!</h1>
  <div class="sub" id="sub">LEVEL 2 · PICK ONE</div>
  <div class="cards" id="cards"></div>
  <div class="acts">
   <button class="btn" id="reroll" type="button"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5"/><path d="M5 10h9M10.5 6l4 4-4 4"/></svg>REROLL <span class="x" id="rc">×2</span></button>
   <button class="btn off" id="choose" type="button"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5"/><path d="M5.5 10.5l3 3 6-7"/></svg>CHOOSE UPGRADE</button>
  </div>
 </div>
 <div class="toast" id="toast"></div>
 <div class="crt"><div class="mask"></div><div class="scan"></div><div class="roll"></div><div class="flick"></div><div class="vig"></div><div class="glass"></div></div>
</div>
<div class="bar"><span>Click a card or press 1 / 2 / 3, then Choose Upgrade (Enter). Reroll with R.</span>
<span class="ctl"><button id="replay" type="button">Replay intro</button><button id="scan" type="button">CRT: on</button></span></div>
</div>
<script>const CFG={color:false,pal:{o:'#021006',a:'#27c25a',b:'#9dffb8',c:'#146b32'}};
const ICONS={
bullets:['............','.c..ooooo...','c..obbbbaao.','.c.ooooooo..','............','.c..ooooo...','c..obbbbaao.','.c.ooooooo..'],
hourglass:['.oooooooooo.','.obbbbbbbbo.','..oaaaaaao..','...oaaaao...','....oaao....','.....oo.....','.....oo.....','....obbo....','...obaabo...','..obaaaabo..','.obbbbbbbbo.','.oooooooooo.'],
shield:['.oooooooooo.','.obbbbbbbbo.','.obaaaaaabo.','.obaaaaaabo.','.obaaaaaabo.','..obaaaabo..','..obaaaabo..','...obaabo...','....obbo....','.....oo.....'],
heart:['.ooo....ooo.','obbbo..obaao','obaaaooaaaao','obaaaaaaaaao','.obaaaaaaao.','..obaaaaao..','...obaaao...','....obao....','.....oo.....'],
bolt:['......oooo..','.....obbao..','....obbao...','...obbaaooo.','..obbbbbbao.','...oooobao..','.....obao...','....obao....','....oao.....','....oo......']};
const COLORS={bullets:{a:'#f2c230',b:'#fff3b0',c:'#b9bfd0',o:'#0b0d14'},hourglass:{a:'#f2c230',b:'#fff3b0',c:'#fff',o:'#0b0d14'},shield:{a:'#2f7df0',b:'#9fe0ff',c:'#fff',o:'#0b0d14'},heart:{a:'#e8334a',b:'#ff9aa8',c:'#fff',o:'#0b0d14'},bolt:{a:'#f2c230',b:'#fff3b0',c:'#fff',o:'#0b0d14'}};
const POOL=[
{n:'Quick Trigger',d:'+10% fire rate',r:'COMMON',i:'bullets'},
{n:'Focus',d:'-6% ability cooldowns',r:'COMMON',i:'hourglass'},
{n:'Reinforced Guard',d:'Your parry shield takes 25% more before it breaks',r:'COMMON',i:'shield',pips:4},
{n:'Thick Skin',d:'+12 max health',r:'COMMON',i:'heart'},
{n:'Overcharge',d:'+8% damage with every weapon',r:'UNCOMMON',i:'bolt'},
{n:'Iron Will',d:'Heal 4% of max health when a wave ends',r:'COMMON',i:'heart',pips:3},
{n:'Hardened Plating',d:'Barrier lasts 15% longer',r:'COMMON',i:'shield'}];
let level=2,rerolls=2,sel=-1,seed=0,shown=[0,1,2];
const $=s=>document.querySelector(s);
function icon(k){const g=ICONS[k],p=CFG.color?COLORS[k]:CFG.pal;let s='<svg viewBox="0 0 12 '+g.length+'" shape-rendering="crispEdges">';
g.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='.')s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+p[c]+'"/>'}));return s+'</svg>'}
function render(anim){
 $('#sub').textContent='LEVEL '+level+' · PICK ONE';
 $('#cards').innerHTML=shown.map((pi,i)=>{const c=POOL[pi];
  return '<button class="card'+(i===sel?' sel':'')+'" data-i="'+i+'" style="--d:'+i+(anim?'':';animation:none')+'" aria-pressed="'+(i===sel)+'">'+
  '<span class="tag'+(c.r==='UNCOMMON'?' unc':'')+'">'+c.r+'</span><span class="ico">'+icon(c.i)+'</span>'+
  '<span class="nm">'+c.n+'</span><span class="ds">'+c.d+'</span>'+
  (c.pips?'<span class="pips">'+'<i></i>'.repeat(c.pips)+'</span>':'')+
  '<span class="key">'+(i+1)+'</span><span class="ln"></span></button>'}).join('');
 $('#reroll').classList.toggle('off',rerolls<1);$('#rc').textContent='×'+rerolls;
 $('#choose').classList.toggle('off',sel<0);$('#choose').classList.toggle('go',sel>=0);
}
function pick(i){sel=i;document.querySelectorAll('.card').forEach((c,j)=>{c.classList.toggle('sel',j===i);c.setAttribute('aria-pressed',j===i)});$('#choose').classList.remove('off');$('#choose').classList.add('go')}
function next3(){const a=[];let k=seed;while(a.length<3){k=(k+1)%POOL.length;if(!a.includes(k))a.push(k)}return a}
function reroll(){if(rerolls<1)return;rerolls--;sel=-1;seed=(seed+3)%POOL.length;
 document.querySelectorAll('.card').forEach(c=>c.classList.add('out'));
 setTimeout(()=>{shown=next3();render(true)},330)}
function choose(){if(sel<0)return;const c=POOL[shown[sel]],t=$('#toast');
 t.innerHTML='<span>'+c.n.toUpperCase()+'<small>UPGRADE ACQUIRED</small></span>';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
 document.querySelectorAll('.card').forEach(x=>x.classList.add('out'));
 setTimeout(()=>{level++;sel=-1;seed=(seed+1)%POOL.length;shown=next3();render(true)},900)}
function replay(){level=2;rerolls=2;sel=-1;seed=0;shown=[0,1,2];const h=$('#h1');h.style.animation='none';void h.offsetWidth;h.style.animation='';render(true)}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(+c.dataset.i);
 if(e.target.closest('#reroll'))reroll();if(e.target.closest('#choose'))choose();
 if(e.target.closest('#replay'))replay();if(e.target.closest('#scan')){const s=$('.stage');s.classList.toggle('noscan');e.target.closest('#scan').textContent=s.classList.contains('noscan')?'CRT: off':'CRT: on'}});
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')pick(+e.key-1);else if(e.key==='r'||e.key==='R')reroll();else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')choose()});
render(true);
</script>

<title>Intro Skip Static</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: controls on top, a 2x2 grid of looping 16:9 players (now + three looks), a note under each.
   Single dark look on purpose: it mocks a game screen. */
:root {
  --page: #080b14; --panel: #11172c; --line: #243055; --fg: #dfe8ff; --muted: #8e9cc4;
  --blue: #66a3ff; --cyan: #5ce1ff; --warn: #ffb347;
  --f-ui: "Rajdhani", system-ui, sans-serif; --f-crt: "VT323", "Courier New", monospace; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--fg); font-family: var(--f-ui); padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 30px; margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 70ch; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.ctl span { color: var(--muted); font: 500 13px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; }
.seg { font: 700 15px var(--f-ui); color: var(--fg); background: #1a2242; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.seg[aria-pressed="true"] { background: #2a4690; border-color: var(--blue); }
.seg:focus-visible, canvas:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
canvas { width: 100%; max-width: 100%; aspect-ratio: 16/9; display: block; border-radius: 6px; background: #000; cursor: pointer; }
figcaption { display: flex; flex-direction: column; gap: 3px; }
figcaption b { font-size: 19px; }
figcaption b i { font: 400 13px var(--f-mono); color: var(--cyan); font-style: normal; margin-left: 8px; }
figcaption small { color: var(--muted); font-size: 15px; line-height: 1.4; }
.now b i { color: var(--warn); }
</style>

<div class="wrap">
  <header>
    <h1>Intro skip: static instead of a cut</h1>
    <p>Each player loops: the intro plays, a click skips it, then the finished screen. Click a player to replay it. Slow it to 0.25× to see the frames.</p>
  </header>
  <div class="ctl">
    <span>Intro</span>
    <button class="seg" id="sc-menu" aria-pressed="true">Main menu (pen plot)</button>
    <button class="seg" id="sc-boot" aria-pressed="false">New run (terminal boot)</button>
    <span style="margin-left:10px">Speed</span>
    <button class="seg" id="sp-1" aria-pressed="true">1×</button>
    <button class="seg" id="sp-q" aria-pressed="false">0.25×</button>
  </div>
  <div class="grid">
    <figure class="now"><canvas id="c0" width="960" height="540" tabindex="0"></canvas>
      <figcaption><b>Now: hard cut<i>0 s</i></b><small>The clock jumps to the end; the finished screen pops in on the next frame.</small></figcaption></figure>
    <figure><canvas id="c1" width="960" height="540" tabindex="0"></canvas>
      <figcaption><b>A · Static burst<i>0.18 s</i></b><small>Two frames of full snow, then the snow thins out over the finished screen, with a white flash on the click.</small></figcaption></figure>
    <figure><canvas id="c2" width="960" height="540" tabindex="0"></canvas>
      <figcaption><b>B · Channel flip<i>0.22 s</i></b><small>Snow with torn rows and a colour split; the finished screen rolls up into place behind it like a TV finding the signal.</small></figcaption></figure>
    <figure><canvas id="c3" width="960" height="540" tabindex="0"></canvas>
      <figcaption><b>C · Static wipe<i>0.2 s</i></b><small>A band of snow sweeps down the screen, the intro above it gone, the finished screen left behind it.</small></figcaption></figure>
  </div>
</div>

f8APCH/AL+v/wDFVW+13P8Az8zf99mj7Xc/8/M3/fZo9ou34Bylnfp3/PCH/v6//wAVRv07/nhD/wB/X/8Aiqrfa7n/AJ+Zv++zR9ruf+fmb/vs0e0Xb8A5Szv07/nhD/39f/4qjfp3/PCH/v6//wAVVb7Xc/8APzN/32aPtdz/AM/M3/fZo9ou34Bylnfp3/PGH/v6/wD8VRv07/njB/39f/4qq32u5/5+Zv8Avs0G7uf+fmb/AL7NL2i7fgHKWd+nf88YP+/r/wDxVG/Tv+eMH/f1/wD4qqv2u5/5+Jv++jR9ruf+fib/AL6NHtF2/AfKWt+nf88YP+/r/wDxVG/Tv+eMH/f1/wD4qqv2u5/5+Jv++jR9ruf+fmb/AL6NHtF2/AOUtb9O/wCeEH/f1/8AGk36d/zwg/7+v/jVb7Xc/wDPzN/32aPtdz/z8zf99mj2i7fgHKWd+nf88IP+/r/40btO/wCeEH/f1/8AGqpu7n/n5m/77NH2y5/5+Zv++zR7RdvwDlLe6wHzLFbjHq7N+hNMm1FCAqsGx0HRR+FV/tlz/wA/M3/fZo+2XP8Az8zf99ml7TsHKMaUO25nBP1pwINpMQQfnj/k1L9suf8An5m/77NMkuJpV2yTSOuc4Zsio5kVY//Z";
const W = 960, H = 540;
const INTRO = 1.5, HOLD = 1.3;
const LOOKS = [0, 0.18, 0.22, 0.2];
let scene = "menu", speed = 1;
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
const clamp = t => Math.max(0, Math.min(1, t));

// Snow: a small grey-blue noise canvas, scaled up without smoothing.
const nz = document.createElement("canvas"); nz.width = 240; nz.height = 135;
const nctx = nz.getContext("2d"); const nimg = nctx.createImageData(240, 135);
function snow() {
  const d = nimg.data;
  for (let y = 0; y < 135; y++) {
    const row = Math.random() < 0.06 ? 1.35 : 1;  // the odd bright row
    for (let x = 0; x < 240; x++) {
      const i = (y * 240 + x) * 4, v = Math.random() * 255 * row;
      d[i] = v * 0.82; d[i + 1] = v * 0.9; d[i + 2] = Math.min(255, v * 1.05 + 20); d[i + 3] = 255;
    }
  }
  nctx.putImageData(nimg, 0, 0);
}
function drawSnow(g, a, x = 0, y = 0, w = W, h = H) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.imageSmoothingEnabled = false;
  g.drawImage(nz, 0, 0, 240, 135 * (h / H), x, y, w, h); g.restore();
}
function scan(g) {
  g.fillStyle = "rgba(0,0,0,0.18)";
  for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.5)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// The intro part-way through (a stand-in for the real one).
function drawIntro(g, t) {
  if (scene === "menu") {
    g.fillStyle = "#0e1220"; g.fillRect(0, 0, W, H);
    const k = clamp(t / INTRO);
    g.save(); g.globalAlpha = 0.25 + 0.35 * k; g.drawImage(IMG.menu, 0, 0, W, H); g.restore();
    // the title box revealed left to right, the axis drawing out
    g.save(); g.beginPath(); g.rect(0, 0, W * (0.15 + 0.7 * k), H * 0.36); g.clip(); g.drawImage(IMG.menu, 0, 0, W, H); g.restore();
    g.strokeStyle = "#9cc0ff"; g.lineWidth = 2; g.beginPath(); g.moveTo(W * 0.1, H * 0.8); g.lineTo(W * (0.1 + 0.8 * k), H * 0.8); g.stroke();
    g.fillStyle = "#cfe0ff"; g.beginPath(); g.arc(W * (0.1 + 0.8 * k), H * 0.8, 4, 0, 7); g.fill();
  } else {
    const gr = g.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, W * 0.6);
    gr.addColorStop(0, "#0d2350"); gr.addColorStop(1, "#040a1c"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const lines = ["> LINK ........ OK", "> PLAYER  Anthony", "> CAT     Knight Tank", "> OPENING LOBBY"];
    const txt = lines.join("\n"), n = Math.floor(t / 0.03);
    g.font = "30px VT323, monospace"; g.fillStyle = "#8fc1ff";
    let shown = txt.slice(0, n).split("\n");
    shown.forEach((l, i) => g.fillText(l, W * 0.3, H * 0.38 + i * 36));
    if (Math.floor(t * 3) % 2 === 0) { const l = shown[shown.length - 1] || ""; g.fillRect(W * 0.3 + g.measureText(l).width + 4, H * 0.38 + (shown.length - 1) * 36 - 22, 12, 26); }
  }
}
function drawEnd(g, dy = 0) {
  g.drawImage(scene === "menu" ? IMG.menu : IMG.boot, 0, dy, W, H);
}
function cursor(g, t) {  // the click ripple
  const x = W * 0.62, y = H * 0.66;
  g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 22); g.lineTo(x + 6, y + 17); g.lineTo(x + 15, y + 17); g.closePath(); g.fill();
  if (t >= 0 && t < 0.35) { g.strokeStyle = `rgba(160,200,255,${1 - t / 0.35})`; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 6 + t * 90, 0, 7); g.stroke(); }
}

function render(g, look, t) {
  const L = LOOKS[look];
  g.save();
  if (t < INTRO) { drawIntro(g, t); scan(g); cursor(g, -1); g.restore(); return; }
  const s = t - INTRO;            // seconds since the click
  if (look === 0 || s >= L) { drawEnd(g); g.restore(); if (s < 0.4) cursor(g, s); return; }
  const k = s / L;
  if (look === 1) {               // A: static burst
    drawEnd(g);
    drawSnow(g, s < 0.035 ? 1 : 1 - ease((s - 0.035) / (L - 0.035)) * 1.0);
    if (s < 0.05) { g.fillStyle = `rgba(220,235,255,${0.55 * (1 - s / 0.05)})`; g.fillRect(0, 0, W, H); }
  } else if (look === 2) {        // B: channel flip
    const roll = (1 - ease(k)) * H * 0.55;
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.9;
    const sp = 14 * (1 - k);
    g.filter = "none";
    g.drawImage(IMG[scene === "menu" ? "menu" : "boot"], -sp, roll, W, H);
    g.globalAlpha = 0.35; g.drawImage(IMG[scene === "menu" ? "menu" : "boot"], sp, roll, W, H);
    g.restore();
    g.fillStyle = "#000"; g.fillRect(0, roll - 26, W, 26);  // the sync bar
    drawEnd(g, roll - H - 26);
    for (let i = 0; i < 7; i++) {  // torn rows
      const y = Math.random() * H, h = 4 + Math.random() * 14, off = (Math.random() - 0.5) * 80 * (1 - k);
      g.drawImage(g.canvas, 0, y, W, h, off, y, W, h);
    }
    drawSnow(g, 0.85 * (1 - ease(k)));
  } else {                        // C: static wipe
    const y = -60 + (H + 120) * ease(k);
    drawIntro(g, INTRO); scan(g);
    g.save(); g.beginPath(); g.rect(0, 0, W, Math.max(0, y - 40)); g.clip(); drawEnd(g); g.restore();
    drawSnow(g, 1, 0, y - 60, W, 80);
    g.fillStyle = "rgba(200,225,255,0.7)"; g.fillRect(0, y + 18, W, 2);
  }
  scan(g);
  g.restore();
  cursor(g, s);
}

const cans = [0, 1, 2, 3].map(i => document.getElementById("c" + i));
const ctxs = cans.map(c => c.getContext("2d"));
const start = cans.map(() => performance.now());
cans.forEach((c, i) => { const r = () => start[i] = performance.now(); c.addEventListener("click", r); c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); r(); } }); });
let last = performance.now();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  snow();
  const loop = INTRO + 0.25 + HOLD;
  cans.forEach((c, i) => {
    const t = ((now - start[i]) / 1000 * speed) % loop;
    render(ctxs[i], i, reduce ? INTRO + 0.05 * speed : t);
  });
  requestAnimationFrame(frame);
}
function sync() { const n = performance.now(); start.fill(n); }
function pick(ids, on) { ids.forEach(id => document.getElementById(id).setAttribute("aria-pressed", id === on)); }
document.getElementById("sc-menu").onclick = () => { scene = "menu"; pick(["sc-menu", "sc-boot"], "sc-menu"); sync(); };
document.getElementById("sc-boot").onclick = () => { scene = "boot"; pick(["sc-menu", "sc-boot"], "sc-boot"); sync(); };
document.getElementById("sp-1").onclick = () => { speed = 1; pick(["sp-1", "sp-q"], "sp-1"); sync(); };
document.getElementById("sp-q").onclick = () => { speed = 0.25; pick(["sp-1", "sp-q"], "sp-q"); sync(); };
requestAnimationFrame(frame);
</script>

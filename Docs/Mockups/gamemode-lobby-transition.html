<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mode To Lobby</title>
<style>
/* Mocks a game screen, so one dark look on purpose. Frames are real Tools/Preview renders; the motion is drawn on a canvas. */
:root { --page:#080b14; --panel:#11172c; --line:#243055; --fg:#dfe8ff; --muted:#8e9cc4; --cyan:#5ce1ff; --gold:#e0b552; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--fg); font:16px/1.45 system-ui, sans-serif; padding:28px 16px 56px; }
.wrap { max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
h1 { font-size:26px; margin:0; }
header p { margin:4px 0 0; color:var(--muted); max-width:70ch; }
.ctl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.seg { font:600 14px system-ui; color:var(--fg); background:#1a2242; border:1px solid var(--line); border-radius:8px; padding:8px 13px; cursor:pointer; }
.seg[aria-pressed="true"] { background:var(--cyan); color:#04141c; border-color:var(--cyan); }
.seg.base[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); }
.go { font:700 14px system-ui; color:#04141c; background:#66a3ff; border:0; border-radius:8px; padding:9px 18px; cursor:pointer; }
.row2 { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; color:var(--muted); font:13px ui-monospace, monospace; }
.row2 label { display:flex; gap:6px; align-items:center; cursor:pointer; }
#scrub { flex:1 1 240px; min-width:0; accent-color:var(--cyan); }
#tread { min-width:9ch; text-align:right; color:var(--cyan); font-variant-numeric:tabular-nums; }
canvas { width:100%; aspect-ratio:16/9; display:block; border:1px solid var(--line); background:#000; }
.note { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
.note h2 { margin:0 0 6px; font:600 13px ui-monospace, monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); }
.note ul { margin:0; padding-left:18px; color:#c9d4f2; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Game Mode → lobby</h1>
    <p>New run's boot (blue CRT, typed log, power-on line) reused for leaving the Game Mode screen. Frames are real preview renders; the motion is approximate (the bezel moves with the screen here, in game it stays put).</p>
  </header>
  <div class="ctl" role="group" aria-label="Option">
    <button class="seg base" data-opt="now">Now: CRT blink · 0.9 s</button>
    <button class="seg" data-opt="a">A: Relink log</button>
    <button class="seg" data-opt="b" aria-pressed="true">B: Quick relink</button>
    <button class="seg" data-opt="c">C: Tune-in</button>
    <button class="go" id="play">▶ Play</button>
  </div>
  <div class="row2">
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
    <span id="tread">0.00 s</span>
    <label><input type="checkbox" id="loop" checked> loop</label>
    <label><input type="checkbox" id="slow"> ¼ speed</label>
  </div>
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="note"><h2 id="nh"></h2><ul id="nl"></ul></div>
</div>

const W = 1280, H = 720, cv = document.getElementById('cv'), g = cv.getContext('2d');
const im = {}; let loaded = 0;
for (const k in IMG) { im[k] = new Image(); im[k].onload = () => { if (++loaded === 3) draw(); }; im[k].src = IMG[k]; }

const seg = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));
const easeIn = x => x * x, easeOut = x => 1 - (1 - x) * (1 - x), easeIO = x => x * x * (3 - 2 * x);
const backSoft = x => 1 + 1.8 * Math.pow(x - 1, 3) + 0.8 * Math.pow(x - 1, 2);
const INK = '111,163,236';

// ---- typed log, as LobbyCrt.CrtLogShown: each line in parts, a blinking pause between parts ----
function logShown(lines, e, at, cs, pause) {
  const out = [];
  for (const parts of lines) {
    let text = '';
    for (let j = 0; j < parts.length; j++) {
      const dur = parts[j].length * cs;
      if (e < at + dur) { out.push(text + parts[j].slice(0, Math.max(0, Math.floor((e - at) / cs)))); return out; }
      text += parts[j]; at += dur;
      if (j < parts.length - 1) { if (e < at + pause) { out.push(text); return out; } at += pause; }
    }
    out.push(text);
  }
  return out;
}
function logEnd(lines, at, cs, pause) { for (const p of lines) { for (const s of p) at += s.length * cs; at += (p.length - 1) * pause; } return at; }

// ---- CrtFuzzyText: bloom, red/cyan fringes, ghost, flicker ----
function fuzzy(s, x, y, a, t, row) {
  g.font = 'bold 36px Arial, Helvetica, sans-serif'; g.textBaseline = 'middle';
  x += Math.sin(t * 23 + row * 1.7) * 0.7;
  const drift = Math.sin(t * 3.1 + row) * 0.6;
  for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4; g.fillStyle = `rgba(${INK},${0.07 * a})`; g.fillText(s, x + Math.cos(an) * 3.5, y + Math.sin(an) * 3); }
  g.fillStyle = `rgba(255,64,77,${0.22 * a})`; g.fillText(s, x - 2.2 - drift, y);
  g.fillStyle = `rgba(51,230,255,${0.22 * a})`; g.fillText(s, x + 2.2 + drift, y);
  g.fillStyle = `rgba(${INK},${0.12 * a})`; g.fillText(s, x + 6, y + 1);
  g.fillStyle = `rgba(${INK},${a * 0.85 * (0.88 + 0.12 * Math.sin(t * 41 + row * 2.3))})`; g.fillText(s, x, y);
}
function drawLog(lines, e, t, a, at, cs, pause, squeeze) {
  if (a <= 0 || squeeze >= 1) return;
  const shown = logShown(lines, e, at, cs, pause), y0 = H / 2 - lines.length * 24;
  g.save();
  if (squeeze > 0) { const bh = 200 * (1 - squeeze); g.beginPath(); g.rect(0, H / 2 - bh / 2, W, bh); g.clip(); }
  shown.forEach((l, i) => {
    const cur = i === shown.length - 1 && Math.floor(t * 2) % 2 === 0 ? '_' : '';
    fuzzy(l + cur, W / 2 - 330, y0 + i * 48 + 24, a, t, i);
  });
  g.restore();
}

// ---- pieces ----
function img(k, a = 1) { if (a <= 0) return; g.globalAlpha = a; g.drawImage(im[k], 0, 0, W, H); g.globalAlpha = 1; }
function squashed(k, sx, sy) { g.drawImage(im[k], W / 2 * (1 - sx), H / 2 * (1 - sy), W * sx, H * sy); }
function fill(r, c) { g.fillStyle = c; g.fillRect(r[0], r[1], r[2], r[3]); }
function glow(cx, cy, rx, ry, c, a) {
  g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx); gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`);
  g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
}
function hLine(cy, lw, a, white) {
  if (a <= 0) return;
  fill([W / 2 - lw / 2, cy - 3, lw, 6], `rgba(${INK},${0.35 * a})`);
  fill([W / 2 - lw / 2, cy - 1, lw, 2], `rgba(${white},${0.75 * a})`);
}
function scan(a) { if (a <= 0) return; g.fillStyle = `rgba(0,0,0,${a})`; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1); }

// The New run power-on (DrawCalmLoadIn style 4), pe seconds after it starts, over the blue screen.
function powerOn(pe, fromW = 700) {
  const across = easeOut(seg(pe, 0.18, 0.35)), open = easeIO(seg(pe, 0.35, 0.8));
  if (pe > 0.12 && open < 1) {
    const lw = fromW + (W - fromW) * across, la = pe < 0.2 ? seg(pe, 0.12, 0.2) : 1 - seg(open, 0.5, 1), half = open * H / 2;
    for (const s of [-1, 1]) hLine(H / 2 + s * half, lw, la, '235,245,255');
  }
  if (open > 0) {
    const half = open * H / 2;
    g.save(); g.beginPath(); g.rect(0, H / 2 - half, W, half * 2); g.clip(); img('lobby');
    const fl = 1 - seg(pe, 0.5, 1.1); if (fl > 0) fill([0, 0, W, H], `rgba(140,190,255,${0.12 * fl})`);
    g.restore();
  }
}

};
for (const o of Object.values(OPTS)) o.init && o.init();
document.querySelectorAll('.seg').forEach(b => { if (b.dataset.opt !== 'now') b.textContent += ' · ' + OPTS[b.dataset.opt].len.toFixed(1) + ' s'; });

// ---- player ----
let opt = 'b', t0 = null, e = 0, playing = false;
const scrub = document.getElementById('scrub'), tread = document.getElementById('tread');
function setNotes() { const o = OPTS[opt]; document.getElementById('nh').textContent = o.title; document.getElementById('nl').innerHTML = o.notes.map(n => `<li>${n.replace(/</g, '&lt;')}</li>`).join(''); }
function draw() { if (loaded < 3) return; const o = OPTS[opt], len = o.len + 0.6; const ee = Math.min(e, o.len);
  if (ee <= 0) img('mode'); else o.draw(ee, performance.now() / 1000);
  scrub.value = Math.round(1000 * e / len); tread.textContent = ee.toFixed(2) + ' s'; }
function frame(now) {
  if (playing) { if (t0 === null) t0 = now - e * 1000 / sp(); e = (now - t0) / 1000 * sp();
    const len = OPTS[opt].len + 0.6; if (e > len) { if (document.getElementById('loop').checked) { e = -0.5; t0 = now + 500 / sp(); } else { e = len; playing = false; } } }
  draw(); requestAnimationFrame(frame);
}
const sp = () => document.getElementById('slow').checked ? 0.25 : 1;
document.getElementById('slow').onchange = () => { t0 = null; };
document.getElementById('play').onclick = () => { e = 0; t0 = null; playing = true; };
scrub.oninput = () => { playing = false; e = scrub.value / 1000 * (OPTS[opt].len + 0.6); };
document.querySelectorAll('.seg').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg').forEach(x => x.setAttribute('aria-pressed', x === b)); opt = b.dataset.opt; setNotes(); e = 0; t0 = null; playing = true; });
window.addEventListener('seek', ev => { playing = false; e = ev.detail; });
setNotes(); playing = true; requestAnimationFrame(frame);
</script>
</body>
</html>
